[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.13.5"

[[repos.hooks]]
id = "uv-lock"
files = '(^|/)pyproject\.toml$|^uv\.lock$'

[[repos.hooks]]
id = "uv-audit"
files = '(^|/)pyproject\.toml$|^uv\.lock$'
# setuptools stays <81 for gluefactory's pkg_resources import, used at runtime only. These
# advisories cover sdist builds on macOS APFS/HFS+ (PYSEC-2026-3447) and legacy wheel installs on
# Windows (GHSA-xmj3-9gf7-h52w), neither of which this workspace does.
args = [
  "--preview-features",
  "audit-command",
  "--ignore",
  "PYSEC-2026-3447",
  "--ignore",
  "GHSA-xmj3-9gf7-h52w",
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ty"
name = "ty"
entry = "uv run --frozen ty check"
language = "system"
pass_filenames = false
always_run = true
