[project]
name = "xfeat-evaluation"
version = "0.1.0"
description = "GlueFactory-based MegaDepth-1500 evaluation of the reference pipeline."
requires-python = ">=3.13"
dependencies = [
  "gluefactory",
  "h5py>=3.16.0",
  "numpy>=2.5.4",
  "omegaconf>=2.4.0",
  "opencv-python-headless>=5.0.0.93",
  "poselib>=2.0.5",
  "setuptools>=80.10.2",
  "tqdm>=4.70.1",
  "xfeat-reference",
]

[project.scripts]
xfeat-megadepth1500 = "xfeat_evaluation.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
xfeat-reference = { workspace = true }
gluefactory = { git = "https://github.com/cvg/glue-factory", rev = "2d17e3b3bd7d30f0c828d4c4d3eac4ecefbf283d" }
