[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ty>=0.0.91",
]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.uv]
override-dependencies = [
  # gluefactory pins scikit-learn~=1.3.0, which has no cp313 wheels
  "scikit-learn>=1.5",
  # gluefactory and lightglue ask for opencv-python; opencv-python-headless provides the same cv2
  # without GUI libraries, and installing both clobbers one cv2 with the other
  "opencv-python; sys_platform == 'never'",
  # gluefactory/eval/io.py imports pkg_resources, removed in setuptools 81
  "setuptools<81",
  # gluefactory/utils/tools.py computes pose AUC with np.trapz, removed in numpy 2.4.0
  "numpy<2.4",
]

[tool.uv.workspace]
members = ["packages/*"]
